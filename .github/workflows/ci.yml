name: CI Quality & Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Lint, Type Check & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.7"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install Testing Dependencies
        run: uv sync --locked --group test --no-install-project

      - name: Setup Reviewdog
        uses: reviewdog/action-setup@v1
        with:
          reviewdog_version: latest

      - name: Run Ruff with Reviewdog
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv run ruff check --output-format=rdjson . | reviewdog -f=rdjson -name="ruff" -reporter=github-pr-review -filter-mode=added -fail-on-error=true

      - name: Run Mypy for Type Checking with Reviewdog
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv run mypy src --show-column-numbers | reviewdog -f=mypy -name="mypy-type-checker" -reporter=github-pr-review -filter-mode=added -level=warning

      - name: Run Unit Tests with Coverage
        run: |
          export PYTHONPATH=$PYTHONPATH:src
          uv run pytest tests/ -v -n auto --cov=ec2_ebs_analysis_cli --cov-report=xml:coverage.xml --junitxml=test-results.xml

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: test-results.xml